name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PHP_VERSION: '8.3'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend (ESLint)
        run: npm run lint --workspaces --if-present

      - name: Lint Backend (Pint)
        run: |
          cd backend
          composer install --no-interaction --prefer-dist
          ./vendor/bin/pint --test

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck Frontend
        run: npm run typecheck --workspaces --if-present

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_db
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: secret
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, zip
          coverage: pcov

      - name: Install Composer dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp backend/.env.example backend/.env

      - name: Generate key
        run: cd backend && php artisan key:generate

      - name: Run migrations
        run: cd backend && php artisan migrate --force

      - name: Run tests
        run: cd backend && php artisan test --coverage

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test --workspaces --if-present

  build-frontend:
    name: Build Frontend Apps
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Cashier PWA
        run: npm run build --workspace=frontend/cashier

      - name: Build Customer Web
        run: npm run build --workspace=frontend/customer

      - name: Build Admin Panel
        run: npm run build --workspace=frontend/admin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            frontend/cashier/dist
            frontend/customer/dist
            frontend/admin/dist
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t irestora-backend:test ./backend

      - name: Build cashier image
        run: docker build -t irestora-cashier:test ./frontend/cashier

      - name: Build customer image
        run: docker build -t irestora-customer:test ./frontend/customer

      - name: Build admin image
        run: docker build -t irestora-admin:test ./frontend/admin